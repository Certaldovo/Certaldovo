<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img"><title>互动叙事创作方向</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#536675" stroke-opacity=".13" stroke-width=".7"/></pattern></defs><style>text{font-family:'Microsoft YaHei',sans-serif}.mono{font-family:Consolas,monospace}.display{font-family:'Arial Narrow','Bahnschrift Condensed',Arial,sans-serif;font-weight:700;letter-spacing:-3px}</style><rect width="1200" height="210" fill="#18212A"/><path d="M0 0H299L279 24H0Z" fill="#8EA5B7"/><text x="30" y="17" font-size="12" class="mono" fill="#18212A">Profile / 创作方向</text><text x="30" y="82" font-size="28" fill="#E7E8E6">从一个想法，到一种体验。</text><text x="31" y="122" font-size="19" fill="#B9C8D2">记录互动叙事的创作过程，让每一次选择都有回应。</text><path d="M724 49V171" stroke="#536675"/><text x="764" y="71" class="mono" font-size="12" fill="#8EA5B7">Current focus</text><text x="764" y="113" font-size="22" fill="#E7E8E6">故事分支与线索反馈</text><text x="764" y="151" font-size="18" fill="#B9C8D2">以及更顺畅的阅读体验</text><rect y="207" width="1200" height="3" fill="#7E2D43"/></svg>
