<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img"><title>互动叙事创作方向</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#536675" stroke-opacity=".13" stroke-width=".7"/></pattern></defs><style>text{font-family:'Microsoft YaHei',sans-serif}.mono{font-family:Consolas,monospace}.display{font-family:'Arial Narrow','Bahnschrift Condensed',Arial,sans-serif;font-weight:700;letter-spacing:-3px}</style><rect width="600" height="270" fill="#18212A"/><path d="M0 0H277L255 25H0Z" fill="#8EA5B7"/><text x="24" y="18" class="mono" font-size="14" fill="#18212A">Profile / 创作方向</text><text x="25" y="80" font-size="30" fill="#E7E8E6">从一个想法，到一种体验。</text><text x="25" y="126" font-size="22" fill="#B9C8D2">记录互动叙事的创作过程，</text><text x="25" y="160" font-size="22" fill="#B9C8D2">让每一次选择都有回应。</text><path d="M25 190H574" stroke="#536675"/><text x="25" y="232" font-size="21" fill="#8EA5B7">正在打磨故事分支、线索与阅读体验。</text></svg>
